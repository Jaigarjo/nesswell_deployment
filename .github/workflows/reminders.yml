# Calls the API every 15 minutes so due reminders go out.
# Setup: repo Settings > Secrets and variables > Actions, add
#   API_URL      e.g. https://wellness-api.onrender.com
#   CRON_SECRET  same value as the API's CRON_SECRET
# GitHub can delay scheduled runs by a few minutes; the API's 3-hour send
# window absorbs that. Scheduled workflows pause after 60 days without
# repo activity; any commit re-enables them.
name: Send reminders
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call send-reminders (retries while Render wakes up)
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 5 --retry-delay 15 --retry-all-errors --max-time 90 \
            -X POST "${{ secrets.API_URL }}/internal/send-reminders" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}"
