# Pulls recent Garmin data hourly. The API only syncs users not synced in the
# last 3 hours and backs off entirely if Garmin rate-limits.
# Uses the same API_URL and CRON_SECRET secrets as reminders.yml.
name: Sync Garmin
on:
  schedule:
    - cron: "17 * * * *"   # off the hour, when fewer jobs run
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call sync-garmin
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 5 --retry-delay 15 --retry-all-errors --max-time 300 \
            -X POST "${{ secrets.API_URL }}/internal/sync-garmin" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}"
